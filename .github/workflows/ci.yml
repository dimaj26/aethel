name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check aethel tests

      - name: Mypy
        run: mypy aethel

      - name: Unit tests
        run: pytest tests/test_config.py tests/test_linter.py tests/test_cli.py -q

      - name: Integration polygon
        run: python tests/run_polygon.py

      - name: Self-lint (dogfooding)
        run: python -m aethel.cli lint .
