# Configuration for Ruff Linter
line-length = 120
target-version = "py311"

# Exclude common directories
exclude = [
    ".git",
    ".pytest_cache",
    "venv",
    "__pycache__"
]

[lint]
# Enable rules:
# F - Pyflakes
# E, W - pycodestyle
# I - isort (import sorting)
# ASYNC - flake8-async
select = ["F", "E", "W", "I", "ASYNC"]

ignore = [
    "E501", # Line too long
]

[lint.per-file-ignores]
# Allow unused imports in init files for modular exports
"**/__init__.py" = ["F401"]
