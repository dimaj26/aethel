[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aethel"
version = "1.1.0"
description = "Aethel: AI Context & Memory CLI Management Utility"
authors = [
    { name = "Aethel Team" }
]
readme = "README.md"
# 3.11+ is required: the linter parses aethel.toml with the stdlib `tomllib`
# module (added in 3.11) and uses PEP 585 builtin generics in annotations.
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = []

[project.scripts]
aethel = "aethel.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["aethel*"]

[tool.setuptools.package-data]
aethel = ["templates/**"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = ["venv/"]
