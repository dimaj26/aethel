# Baseline Ruff configuration for Aethel Python projects
target-version = "py311"
line-length = 120

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C90", # mccabe complexity
]
ignore = []

[lint.mccabe]
max-complexity = 10
